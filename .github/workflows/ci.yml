name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test — Age/Eligibility Gate dApp
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Cache node_modules so npm ci runs in seconds on subsequent runs
    - name: Cache node_modules
      uses: actions/cache@v4
      id: cache-node
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-

    - name: Install Frontend Dependencies
      if: steps.cache-node.outputs.cache-hit != 'true'
      working-directory: ./frontend
      run: npm ci

    - name: Typecheck Frontend
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run Tests (minimum 5 required)
      working-directory: ./frontend
      run: npm run test

    - name: Build Frontend for Production
      working-directory: ./frontend
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7
